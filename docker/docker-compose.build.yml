# Chi dung khi can BUILD image client (chay trong thu muc docker/):
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build client
services:
  client:
    build:
      context: ..
      dockerfile: docker/client.Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
